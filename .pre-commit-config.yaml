repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.11.12
  hooks:
    # Run the linter.
    - id: ruff-check
      types_or: [ python, pyi ]
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi ]
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.24.2
  hooks:
    - id: gitleaks
- repo: local
  hooks:
    - id: dependency-policy-gate
      name: Check runtime dependency policy
      entry: python3 scripts/check_dependency_e2e.py policy
      language: system
      pass_filenames: false
      files: ^pyproject\.toml$
    - id: yaml-secret-scan
      name: Detect concrete secrets in YAML
      entry: scripts/scan_yaml_secrets.py
      language: python
      types_or: [yaml]
