name: Publish Studio Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-studio-release.yaml"
      - "frontend/**"
      - "services/studio_release_server/**"
      - "veadk/cli/cli.py"
      - "veadk/cli/cli_frontend.py"
      - "veadk/cli/frontend_*.py"
      - "veadk/cli/studio_*.py"
      - "veadk/cloud/**"
      - "veadk/integrations/ve_apig/**"
      - "veadk/integrations/ve_faas/**"
      - "veadk/integrations/ve_identity/**"
      - "veadk/utils/volcengine_sign.py"
      - "veadk/config.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      changelog:
        description: User-facing Studio release summary
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: studio-main-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'volcengine/veadk-python'
    runs-on: ubuntu-latest
    environment: studio-release
    env:
      RELEASE_SERVER_URL: ${{ secrets.STUDIO_RELEASE_SERVER_URL }}
      RELEASE_SERVER_API_KEY: ${{ secrets.STUDIO_RELEASE_SERVER_API_KEY }}

    steps:
      - name: Validate release server configuration
        run: |
          set -euo pipefail
          test -n "$RELEASE_SERVER_URL" || {
            echo "STUDIO_RELEASE_SERVER_URL is not configured." >&2
            exit 1
          }
          test -n "$RELEASE_SERVER_API_KEY" || {
            echo "STUDIO_RELEASE_SERVER_API_KEY is not configured." >&2
            exit 1
          }

      - name: Resolve release changelog
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          changelog="$MANUAL_CHANGELOG"
          if [[ -z "$changelog" ]]; then
            changelog="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                --jq '.[0].title // empty'
            )"
          fi
          if [[ -z "$changelog" ]]; then
            changelog="${{ github.event.head_commit.message }}"
            changelog="${changelog%%$'\n'*}"
          fi
          test -n "$changelog" || {
            echo "Studio release changelog is empty." >&2
            exit 1
          }
          echo "value=$changelog" >> "$GITHUB_OUTPUT"

      - name: Request Studio release
        id: release
        env:
          STUDIO_CHANGELOG: ${{ steps.changelog.outputs.value }}
        run: |
          set -euo pipefail
          job_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg gitSha "$GITHUB_SHA" \
            --arg requestId "$job_id" \
            --arg changelog "$STUDIO_CHANGELOG" \
            '{repository:$repository,gitSha:$gitSha,requestId:$requestId,changelog:[$changelog]}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-API-Key: $RELEASE_SERVER_API_KEY" \
            --data "$payload" \
            "$RELEASE_SERVER_URL/release" >/dev/null
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Studio release
        env:
          JOB_ID: ${{ steps.release.outputs.job_id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 180); do
            response="$(curl --fail-with-body --silent --show-error \
              --header "X-API-Key: $RELEASE_SERVER_API_KEY" \
              "$RELEASE_SERVER_URL/status/$JOB_ID")"
            state="$(jq -r '.state' <<<"$response")"
            stage="$(jq -r '.stage' <<<"$response")"
            echo "Studio release state=$state stage=$stage"
            if [[ "$state" == "succeeded" ]]; then
              jq '{state,stage,result}' <<<"$response"
              exit 0
            fi
            if [[ "$state" == "failed" ]]; then
              jq '{state,stage,message,error}' <<<"$response" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Studio release timed out after 30 minutes." >&2
          exit 1
