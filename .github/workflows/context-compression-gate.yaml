name: Context Compression Gate

on:
  workflow_call:
  pull_request:
    paths:
      - 'veadk/context/**'
      - 'veadk/agent.py'
      - 'veadk/runner.py'
      - 'veadk/memory/**'
      - 'veadk/agents/**'
      - 'veadk/models/**'
      - 'veadk/cli/generated_agent_*.py'
      - 'veadk/cli/cli_frontend.py'
      - 'veadk/integrations/agentkit/app.py'
      - 'frontend/src/create/**'
      - 'frontend/src/adk/client.ts'
      - 'frontend/src/ui/AgentTopology.tsx'
      - 'frontend/src/i18n/resources/**'
      - 'frontend/tests/contextCompression*.test.mjs'
      - 'veadk/extensions/harness/plugins/compactor/**'
      - 'tests/context/**'
      - 'tests/agent/**'
      - 'evaluations/context_compression/**'
      - 'tests/models/**'
      - 'tests/run_context_compression_gate.py'
      - 'tests/test_context_release_gate.py'
      - '.github/workflows/context-compression-gate.yaml'
      - '.github/workflows/publish-tag-to-pypi.yaml'
      - '.github/workflows/publish-studio-release.yaml'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  studio-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/contextCompression*.test.mjs
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        adk: ['1.34.0', '2.1.0', '2.2.0', '2.9.2']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install fixed ADK compatibility target
        run: python -m pip install -e '.[dev]' 'google-adk==${{ matrix.adk }}'
      - name: Run isolated SDK and Runner contracts
        run: python tests/run_context_compression_gate.py -q
