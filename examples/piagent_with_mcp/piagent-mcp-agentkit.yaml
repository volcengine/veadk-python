common:
  agent_name: piagent-with-mcp
  entry_point: app.py
  description: VeADK PiAgent runtime example using an MCP toolset.
  language: Python
  language_version: '3.12'
  agent_type: Basic App
  dependencies_file: requirements.txt
  launch_type: cloud
launch_types:
  cloud:
    region: cn-beijing
    tos_bucket: agentkit-platform-{{account_id}}
    tos_prefix: agentkit-builds
    image_tag: '{{timestamp}}'
    cr_instance_name: agentkit-platform-{{account_id}}
    cr_namespace_name: agentkit
    cr_repo_name: piagent-with-mcp
    cr_auto_create_instance_type: Micro
    cr_image_full_url: <registry>/<namespace>/piagent-with-mcp:<tag>
    build_timeout: 3600
    cp_workspace_name: agentkit-cli-workspace
    cp_pipeline_name: piagent-with-mcp
    cp_pipeline_id: <pipeline-id>
    runtime_id: <runtime-id>
    runtime_name: piagent-with-mcp
    runtime_role_name: <runtime-role-name>
    runtime_auth_type: key_auth
    runtime_apikey_name: <runtime-api-key-name>
    runtime_apikey: <runtime-api-key>
    runtime_jwt_allowed_clients: []
    runtime_endpoint: <runtime-endpoint>
docker_build:
  platform: linux/amd64
