apiVersion: apps/v1
kind: Deployment
metadata:
  name: veadk-self-host-sandbox
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: veadk-self-host-sandbox
  template:
    metadata:
      labels:
        app: veadk-self-host-sandbox
    spec:
      imagePullSecrets:
        - name: cr-zn-datapath-cn-beijing
      containers:
        - name: veadk-web
          image: zn-datapath-cn-beijing.cr.volces.com/sandbox/veadk-self-host-sandbox:20260828-105455
          imagePullPolicy: Always
          env:
            - name: ANTHROPIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: veadk-self-host-sandbox-env
                  key: ANTHROPIC_BASE_URL
            - name: ANTHROPIC_ENVIRONMENT_ID
              valueFrom:
                secretKeyRef:
                  name: veadk-self-host-sandbox-env
                  key: ANTHROPIC_ENVIRONMENT_ID
            - name: ANTHROPIC_ENVIRONMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: veadk-self-host-sandbox-env
                  key: ANTHROPIC_ENVIRONMENT_KEY
            - name: SANDBOX_AGENT_ID
              valueFrom:
                secretKeyRef:
                  name: veadk-self-host-sandbox-env
                  key: SANDBOX_AGENT_ID
            - name: X_TOP_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: veadk-self-host-sandbox-env
                  key: X_TOP_ACCOUNT_ID
          ports:
            - name: http
              containerPort: 8067
          readinessProbe:
            httpGet:
              path: /list-apps
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /list-apps
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: veadk-self-host-sandbox
  namespace: default
spec:
  selector:
    app: veadk-self-host-sandbox
  ports:
    - name: http
      port: 8067
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: veadk-self-host-sandbox
  namespace: default
  annotations:
    ingress.vke.volcengine.com/apig-instance-name: apig-instance-demo
spec:
  ingressClassName: apig
  rules:
    - host: example2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: veadk-self-host-sandbox
                port:
                  number: 8067
